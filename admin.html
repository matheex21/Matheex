<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — MatheeX</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="MatheeX admin panel — private.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070a;
    --bg-raised:#0e0e12;
    --bg-card:#131317;
    --red:#ff1e2d;
    --red-deep:#7a0f16;
    --red-glow: rgba(255,30,45,0.45);
    --white:#f4f3f0;
    --muted:#93939b;
    --line: rgba(244,243,240,0.09);
    --font-display: 'Rajdhani', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-si: 'Noto Sans Sinhala', 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family: var(--font-si), var(--font-body);
    line-height:1.6;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}

  ::selection{ background:var(--red); color:#fff; }

  /* ---------- Jagged bolt shapes (signature motif) ---------- */
  .bolt{
    position:absolute;
    background: linear-gradient(160deg, var(--red), var(--red-deep));
    clip-path: polygon(38% 0, 100% 0, 46% 46%, 78% 46%, 8% 100%, 30% 52%, 0 52%);
    opacity:0.9;
    filter: drop-shadow(0 0 18px var(--red-glow));
    pointer-events:none;
  }

  /* ---------- Skip link ---------- */
  .skip-link{
    position:absolute; left:-9999px; top:0; background:var(--red); color:#fff;
    padding:12px 18px; z-index:999; font-family:var(--font-display); font-weight:700;
  }
  .skip-link:focus{ left:16px; top:16px; }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  /* ---------- Header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 6vw;
    background: linear-gradient(to bottom, rgba(7,7,10,0.92), rgba(7,7,10,0));
    backdrop-filter: blur(6px);
  }
  .wordmark{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 1.5rem;
    letter-spacing:0.5px;
    text-decoration:none;
    display:flex; align-items:center;
  }
  .wordmark span{ color: var(--red); }
  nav.site-nav{ display:flex; gap: 2.2rem; }
  nav.site-nav a{
    font-family: var(--font-display);
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-decoration:none;
    color: var(--muted);
    transition: color 0.2s;
    position:relative;
  }
  nav.site-nav a:hover{ color: var(--white); }
  nav.site-nav a::after{
    content:''; position:absolute; left:0; bottom:-6px; height:2px; width:0;
    background:var(--red); transition: width 0.25s;
  }
  nav.site-nav a:hover::after{ width:100%; }
  .nav-cta{
    font-family: var(--font-display); font-weight:700; text-transform:uppercase;
    font-size:0.85rem; letter-spacing:0.05em;
    background:var(--red); color:#fff !important; padding:10px 20px; border-radius:2px;
    text-decoration:none; box-shadow: 0 0 0 rgba(255,30,45,0.6); transition: box-shadow 0.25s, transform 0.2s;
  }
  .nav-cta:hover{ box-shadow: 0 0 22px var(--red-glow); transform: translateY(-1px); }
  .menu-btn{ display:none; background:none; border:0; color:var(--white); font-size:1.6rem; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex; align-items:center;
    padding: 120px 6vw 80px;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 75% 30%, rgba(255,30,45,0.14), transparent 55%);
    pointer-events:none;
  }
  .hero-ring{
    position:absolute; right:-8vw; top:50%; transform:translateY(-50%);
    width:min(58vw, 680px); height:min(58vw, 680px);
    border-radius:50%;
    border: 2px solid rgba(255,30,45,0.5);
    opacity:0.7;
  }
  .hero-ring::after{
    content:''; position:absolute; inset:14px; border-radius:50%;
    border: 1px solid rgba(255,30,45,0.18);
  }
  .hero-grid{
    position:relative; z-index:2;
    display:grid; grid-template-columns: 1.1fr 0.9fr; gap: 3vw; align-items:center;
    width:100%; max-width:1320px; margin:0 auto;
  }
  .eyebrow{
    font-family: var(--font-display); font-weight:600; letter-spacing:0.35em;
    text-transform:uppercase; color:var(--red); font-size:0.82rem; margin-bottom:1.1rem;
    display:flex; align-items:center; gap:0.7rem;
  }
  .eyebrow::before{ content:''; width:26px; height:2px; background:var(--red); display:inline-block; }
  h1.hero-title{
    font-family: var(--font-display);
    font-weight:700;
    font-size: clamp(2.8rem, 6vw, 5.2rem);
    line-height:0.98;
    margin:0 0 1.2rem;
    letter-spacing:-0.01em;
  }
  h1.hero-title .x{ color:var(--red); }
  .hero-sub{
    font-family: var(--font-si);
    font-size: 1.15rem;
    color:#d7d6d2;
    max-width:520px;
    margin: 0 0 2.1rem;
  }
  .hero-sub .accent{ color:var(--red); font-weight:600; }
  .hero-ctas{ display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:2.6rem; }
  .btn-primary, .btn-ghost{
    font-family: var(--font-display); font-weight:700; text-transform:uppercase;
    font-size:0.92rem; letter-spacing:0.04em;
    padding:15px 30px; text-decoration:none; border-radius:2px;
    display:inline-flex; align-items:center; gap:0.6rem;
    transition: all 0.25s;
  }
  .btn-primary{
    background:var(--red); color:#fff;
    box-shadow: 0 6px 24px rgba(255,30,45,0.25);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 10px 30px var(--red-glow); }
  .btn-ghost{
    border: 1.5px solid rgba(244,243,240,0.25); color:var(--white);
  }
  .btn-ghost:hover{ border-color:var(--red); color:var(--red); }
  .hero-stats{ display:flex; gap:2.4rem; flex-wrap:wrap; }
  .hero-stats div{ border-left: 2px solid var(--red); padding-left:0.8rem; }
  .hero-stats strong{
    display:block; font-family:var(--font-display); font-size:1.4rem; font-weight:700;
  }
  .hero-stats span{ font-size:0.8rem; color:var(--muted); font-family:var(--font-si); }

  .hero-portrait{
    position:relative; z-index:2;
    display:flex; justify-content:center;
  }
  .portrait-frame{
    position:relative;
    width:min(80vw, 420px);
    aspect-ratio: 1/1;
    border-radius:50%;
    overflow:hidden;
    border: 3px solid var(--red);
    box-shadow: 0 0 60px var(--red-glow), inset 0 0 40px rgba(0,0,0,0.4);
  }
  .portrait-frame img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Section basics ---------- */
  section{ position:relative; padding: 100px 6vw; }
  .section-inner{ max-width:1320px; margin:0 auto; position:relative; z-index:2; }
  .section-head{ max-width:640px; margin-bottom:3.2rem; }
  .section-head .eyebrow{ margin-bottom:0.9rem; }
  h2.section-title{
    font-family:var(--font-display); font-weight:700;
    font-size: clamp(2rem, 3.6vw, 3rem); margin:0 0 1rem; line-height:1.05;
  }
  h2.section-title .x{ color:var(--red); }
  .section-desc{ font-family:var(--font-si); color:#c9c8c4; font-size:1.05rem; }

  /* ---------- About ---------- */
  .about{ background:var(--bg-raised); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .badge-row{ display:flex; flex-wrap:wrap; gap:1rem; margin: 2rem 0 2.6rem; }
  .badge{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.02em;
    background:var(--bg-card); border:1px solid var(--line); color:var(--white);
    padding:12px 20px; border-radius:2px; font-size:0.98rem;
    display:flex; align-items:center; gap:0.6rem;
  }
  .badge::before{ content:''; width:8px; height:8px; background:var(--red); transform:rotate(45deg); flex-shrink:0; }
  .about-body{ font-family: var(--font-si); color:#d3d2ce; font-size:1.05rem; max-width:760px; white-space:pre-line; }

  /* ---------- Videos ---------- */
  .video-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap:1.6rem;
  }
  .video-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:4px; overflow:hidden;
    transition: transform 0.25s, border-color 0.25s;
  }
  .video-card:hover{ transform: translateY(-4px); border-color: rgba(255,30,45,0.5); }
  .video-thumb{
    position:relative; aspect-ratio:16/9; background:#000 url('') center/cover;
    cursor:pointer; overflow:hidden;
  }
  .video-thumb img{ width:100%; height:100%; object-fit:cover; opacity:0.85; transition:opacity 0.2s; }
  .video-thumb:hover img{ opacity:1; }
  .video-thumb .play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  }
  .video-thumb .play span{
    width:56px; height:56px; border-radius:50%; background:rgba(255,30,45,0.92);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 26px var(--red-glow);
  }
  .video-thumb .play svg{ width:20px; height:20px; fill:#fff; margin-left:3px; }
  .video-thumb iframe{ width:100%; height:100%; border:0; display:block; }
  .video-meta{ padding: 1rem 1.1rem 1.3rem; }
  .video-title{
    font-family:var(--font-si); font-weight:600; font-size:0.98rem; color:var(--white);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height:2.6em;
  }
  .video-title.skeleton{
    color:transparent; background: linear-gradient(90deg, var(--line) 25%, rgba(244,243,240,0.16) 37%, var(--line) 63%);
    background-size:400% 100%; animation:shimmer 1.4s infinite; border-radius:3px;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
  .video-tag{
    font-family:var(--font-display); font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--red); margin-top:0.5rem; display:block;
  }

  /* ---------- Comments ---------- */
  .comments{ background:var(--bg-raised); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .comment-form{
    background:var(--bg-card); border:1px solid var(--line); border-radius:4px;
    padding:1.6rem; margin-bottom:2.4rem; max-width:720px;
  }
  .comment-form .row{ display:flex; gap:0.9rem; flex-wrap:wrap; margin-bottom:0.9rem; }
  .comment-form input[type="text"]{
    flex:1; min-width:180px;
    background:var(--bg); border:1px solid var(--line); color:var(--white);
    padding:12px 14px; border-radius:2px; font-family:var(--font-si); font-size:0.95rem;
  }
  .comment-form textarea{
    width:100%; min-height:90px; resize:vertical;
    background:var(--bg); border:1px solid var(--line); color:var(--white);
    padding:12px 14px; border-radius:2px; font-family:var(--font-si); font-size:0.95rem;
    margin-bottom:0.9rem;
  }
  .comment-form input:focus, .comment-form textarea:focus{ outline:none; border-color:var(--red); }
  .comment-form .form-foot{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .comment-status{ font-family:var(--font-si); font-size:0.85rem; color:var(--muted); min-height:1.2em; }
  .btn-send{
    font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:0.85rem;
    letter-spacing:0.04em; background:var(--red); color:#fff; border:0; padding:12px 26px;
    border-radius:2px; cursor:pointer; transition: box-shadow 0.25s, transform 0.2s, opacity 0.2s;
  }
  .btn-send:hover{ box-shadow:0 8px 22px var(--red-glow); transform:translateY(-1px); }
  .btn-send:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .hp-field{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }

  .comment-list{ display:flex; flex-direction:column; gap:1rem; max-width:720px; }
  .comment-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:4px;
    padding:1.1rem 1.3rem; position:relative;
  }
  .comment-card .c-head{ display:flex; align-items:center; justify-content:space-between; gap:0.8rem; margin-bottom:0.4rem; }
  .comment-card .c-name{ font-family:var(--font-display); font-weight:700; color:var(--white); font-size:0.98rem; }
  .comment-card .c-time{ font-family:var(--font-si); color:var(--muted); font-size:0.78rem; }
  .comment-card .c-msg{ font-family:var(--font-si); color:#d3d2ce; font-size:0.96rem; white-space:pre-wrap; word-break:break-word; }
  .comment-empty{ font-family:var(--font-si); color:var(--muted); font-size:0.95rem; }
  .c-delete{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:2px;
    font-size:0.75rem; padding:5px 10px; cursor:pointer; font-family:var(--font-display);
    text-transform:uppercase; letter-spacing:0.04em; transition:all 0.2s;
  }
  .c-delete:hover{ color:var(--red); border-color:var(--red); }

  .admin-bar{ max-width:720px; margin-top:2.4rem; padding-top:1.6rem; border-top:1px dashed var(--line); }
  .admin-toggle{
    background:none; border:0; color:var(--muted); font-family:var(--font-display);
    text-transform:uppercase; letter-spacing:0.05em; font-size:0.8rem; cursor:pointer; padding:0;
  }
  .admin-toggle:hover{ color:var(--red); }
  .admin-panel{
    margin-top:1rem; background:var(--bg-card); border:1px solid var(--line); border-radius:4px;
    padding:1.3rem; display:none;
  }
  .admin-panel.open{ display:block; }
  .admin-panel .row{ display:flex; gap:0.7rem; flex-wrap:wrap; margin-bottom:0.8rem; }
  .admin-panel input{
    flex:1; min-width:160px; background:var(--bg); border:1px solid var(--line); color:var(--white);
    padding:10px 12px; border-radius:2px; font-family:var(--font-body); font-size:0.9rem;
  }
  .admin-status{ font-family:var(--font-si); color:var(--muted); font-size:0.85rem; margin-top:0.4rem; }
  .admin-loggedin{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .admin-loggedin span{ font-family:var(--font-si); color:#c9c8c4; font-size:0.9rem; }
  .btn-danger{
    font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:0.8rem;
    letter-spacing:0.04em; background:transparent; border:1.5px solid var(--red); color:var(--red);
    padding:9px 18px; border-radius:2px; cursor:pointer; transition:all 0.2s;
  }
  .btn-danger:hover{ background:var(--red); color:#fff; }
  .btn-link{
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.04em; font-size:0.8rem;
    background:none; border:0; color:var(--muted); cursor:pointer; text-decoration:underline;
  }
  .btn-link:hover{ color:var(--white); }

  /* ---------- Sponsorship ---------- */
  .sponsor{ background:var(--bg); }
  .sponsor-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:3rem; align-items:center; }
  .sponsor-types{ display:flex; flex-direction:column; gap:0.9rem; margin: 1.6rem 0 2rem; }
  .sponsor-type{
    display:flex; align-items:center; gap:0.8rem;
    background:var(--bg-card); border:1px solid var(--line); border-radius:4px;
    padding:0.9rem 1.1rem; font-family:var(--font-si); font-size:0.98rem; color:#d3d2ce;
  }
  .sponsor-type::before{ content:''; width:8px; height:8px; background:var(--red); transform:rotate(45deg); flex-shrink:0; }
  .sponsor-type strong{ font-family:var(--font-display); color:var(--white); font-weight:700; margin-right:0.3rem; }
  .sponsor-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:6px;
    padding:2.2rem; text-align:center;
  }
  .sponsor-card p.lead{ font-family:var(--font-si); color:#c9c8c4; margin-bottom:1.6rem; font-size:1rem; }
  .sponsor-email{
    font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--red);
    word-break:break-all; margin-bottom:1.4rem; display:block;
  }
  @media (max-width: 980px){
    .sponsor-grid{ grid-template-columns:1fr; }
  }

  /* ---------- Subscribe CTA ---------- */
  .subscribe{
    background: linear-gradient(135deg, var(--bg-raised), var(--bg));
    border-top:1px solid var(--line);
    text-align:center;
    overflow:hidden;
  }
  .subscribe .section-inner{ display:flex; flex-direction:column; align-items:center; }
  .subscribe h2{
    font-family:var(--font-display); font-weight:700; font-size:clamp(2.2rem,5vw,3.6rem);
    margin:0 0 1rem; max-width:820px;
  }
  .subscribe h2 .x{ color:var(--red); }
  .subscribe p{ font-family:var(--font-si); color:#c9c8c4; max-width:560px; margin:0 0 2.2rem; font-size:1.05rem; }

  /* ---------- Footer ---------- */
  footer{
    padding: 46px 6vw 34px; border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:1.5rem; align-items:center; justify-content:space-between;
  }
  .footer-left{ display:flex; align-items:center; gap:1rem; }
  footer .wordmark{ font-size:1.15rem; }
  footer p{ color:var(--muted); font-size:0.85rem; margin:0; font-family:var(--font-si); }
  .footer-links{ display:flex; gap:1.6rem; }
  .footer-links a{ color:var(--muted); text-decoration:none; font-size:0.9rem; transition:color 0.2s; font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.04em; }
  .footer-links a:hover{ color:var(--red); }

  /* ---------- Responsive ---------- */
  @media (max-width: 980px){
    nav.site-nav{ display:none; }
    .menu-btn{ display:block; }
    .hero-grid{ grid-template-columns:1fr; text-align:center; }
    .hero-sub{ margin-left:auto; margin-right:auto; }
    .hero-ctas, .hero-stats{ justify-content:center; }
    .hero-stats div{ text-align:left; }
    .hero-portrait{ order:-1; margin-bottom:2rem; }
    .hero-ring{ display:none; }
    .video-grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px){
    section{ padding:70px 6vw; }
    .video-grid{ grid-template-columns: 1fr; }
    header{ padding:16px 5vw; }
  }

  /* ---------- Phones catalog ---------- */
  .phones-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap:1.6rem;
  }
  .phone-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:6px; overflow:hidden;
    transition: transform 0.25s, border-color 0.25s; display:flex; flex-direction:column;
  }
  .phone-card:hover{ transform: translateY(-4px); border-color: rgba(255,30,45,0.5); }
  .phone-img-wrap{ aspect-ratio:1/1; background:#000; overflow:hidden; }
  .phone-img-wrap img{ width:100%; height:100%; object-fit:cover; }
  .phone-body{ padding:1.1rem 1.2rem 1.3rem; display:flex; flex-direction:column; flex:1; }
  .phone-name{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--white); margin:0 0 0.3rem; }
  .phone-price{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; color:var(--red); margin:0 0 0.8rem; }
  .phone-specs{ list-style:none; padding:0; margin:0 0 auto; font-family:var(--font-si); font-size:0.88rem; color:#c9c8c4; display:flex; flex-direction:column; gap:0.35rem; }
  .phone-specs li{ display:flex; align-items:flex-start; gap:0.5rem; }
  .phone-specs li::before{ content:''; width:6px; height:6px; background:var(--red); transform:rotate(45deg); margin-top:0.4rem; flex-shrink:0; }
  .phone-empty, .phone-loading{ font-family:var(--font-si); color:var(--muted); font-size:0.95rem; grid-column:1/-1; text-align:center; padding:3rem 0; }
  .skeleton-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .skeleton-block{
    background: linear-gradient(90deg, var(--line) 25%, rgba(244,243,240,0.16) 37%, var(--line) 63%);
    background-size:400% 100%; animation:shimmer 1.4s infinite;
  }
  .skeleton-card .phone-img-wrap{ }
  @media (max-width: 980px){ .phones-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .phones-grid{ grid-template-columns: 1fr; } }

  /* ---------- Admin ---------- */
  .admin-gate{
    max-width:420px; margin:0 auto; background:var(--bg-card); border:1px solid var(--line);
    border-radius:8px; padding:2rem;
  }
  .admin-gate .field{ margin-bottom:1.1rem; }
  .admin-gate label{
    display:block; font-family:var(--font-display); font-weight:600; font-size:0.83rem;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:0.5rem;
  }
  .admin-gate input{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--white);
    padding:12px 14px; border-radius:2px; font-family:var(--font-body); font-size:0.95rem;
  }
  .admin-gate input:focus{ outline:none; border-color:var(--red); }

  .admin-content{ display:none; }
  .admin-content.show{ display:block; }
  .admin-topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:2.4rem; }
  .admin-topbar span{ font-family:var(--font-si); color:#c9c8c4; font-size:0.92rem; }

  .upload-form{
    background:var(--bg-card); border:1px solid var(--line); border-radius:8px; padding:2rem; max-width:640px; margin-bottom:3rem;
  }
  .upload-form .field{ margin-bottom:1.3rem; }
  .upload-form label{
    display:block; font-family:var(--font-display); font-weight:600; font-size:0.83rem;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:0.5rem;
  }
  .upload-form input[type="text"], .upload-form input[type="number"], .upload-form textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--white);
    padding:12px 14px; border-radius:2px; font-family:var(--font-si); font-size:0.95rem;
  }
  .upload-form textarea{ min-height:110px; resize:vertical; }
  .upload-form input:focus, .upload-form textarea:focus{ outline:none; border-color:var(--red); }
  .file-drop{
    border:1.5px dashed rgba(244,243,240,0.25); border-radius:4px; padding:1.4rem; text-align:center;
    cursor:pointer; transition:border-color 0.2s;
  }
  .file-drop:hover{ border-color:var(--red); }
  .file-drop input[type="file"]{ display:none; }
  .file-drop p{ font-family:var(--font-si); color:var(--muted); font-size:0.9rem; margin:0; }
  .file-preview{ margin-top:0.9rem; max-width:160px; border-radius:4px; overflow:hidden; display:none; }
  .file-preview.show{ display:block; }
  .file-preview img{ width:100%; display:block; }
  .upload-status{ margin-top:1rem; font-family:var(--font-si); font-size:0.9rem; min-height:1.2em; }
  .upload-status.ok{ color:#4ade80; }
  .upload-status.err{ color:var(--red); }
  .upload-progress{
    width:100%; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; margin-top:0.8rem; display:none;
  }
  .upload-progress.show{ display:block; }
  .upload-progress .bar{ height:100%; width:0%; background:var(--red); transition:width 0.2s; }

  .admin-phone-list{ display:flex; flex-direction:column; gap:0.9rem; max-width:760px; }
  .admin-phone-row{
    display:flex; align-items:center; gap:1rem; background:var(--bg-card); border:1px solid var(--line);
    border-radius:4px; padding:0.8rem 1rem;
  }
  .admin-phone-row img{ width:56px; height:56px; object-fit:cover; border-radius:3px; flex-shrink:0; background:#000; }
  .admin-phone-row .info{ flex:1; min-width:0; }
  .admin-phone-row .info strong{ font-family:var(--font-display); color:var(--white); display:block; font-size:0.98rem; }
  .admin-phone-row .info span{ font-family:var(--font-si); color:var(--red); font-size:0.85rem; }
</style>
</head>
<body>
<a href="#main" class="skip-link">ප්‍රධාන අන්තර්ගතයට යන්න</a>

<header>
  <a href="index.html" class="wordmark">Mathee<span>X</span></a>
  <nav class="site-nav" aria-label="ප්‍රධාන navigation">
    <a href="index.html">Home</a>
    <a href="phones.html">Phones</a>
    <a href="comments.html">Comments</a>
  </nav>
</header>

<main id="main">
  <section class="hero" style="min-height:auto; padding:150px 6vw 60px;">
    <div class="hero-grid" style="grid-template-columns:1fr; text-align:left;">
      <div class="hero-copy">
        <p class="eyebrow">Private</p>
        <h1 class="hero-title" style="font-size:clamp(2rem, 4vw, 3.2rem);">Admin <span class="x">Panel.</span></h1>
        <p class="hero-sub">Phone catalog එක manage කරන්න — add / delete.</p>
      </div>
    </div>
  </section>

  <section>
    <div class="section-inner">

      <!-- Login gate -->
      <div class="admin-gate" id="admin-gate">
        <p class="form-title" style="font-family:var(--font-display); font-weight:700; font-size:1.15rem; margin:0 0 1.3rem;">Admin Login</p>
        <div class="field">
          <label for="a-email">Email</label>
          <input type="text" id="a-email" autocomplete="username">
        </div>
        <div class="field">
          <label for="a-pass">Password</label>
          <input type="password" id="a-pass" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="a-login-btn" type="button" style="width:100%; justify-content:center;">Login</button>
        <p class="upload-status" id="a-login-status"></p>
      </div>

      <!-- Admin content (shown after login) -->
      <div class="admin-content" id="admin-content">
        <div class="admin-topbar">
          <span id="admin-who"></span>
          <button class="btn-link" id="a-logout" type="button">Logout</button>
        </div>

        <form class="upload-form" id="upload-form">
          <p style="font-family:var(--font-display); font-weight:700; font-size:1.15rem; margin:0 0 1.4rem;">Add a Phone</p>

          <div class="field">
            <label for="p-name">Phone Name</label>
            <input type="text" id="p-name" required maxlength="100" placeholder="e.g. Samsung Galaxy S25 Ultra">
          </div>

          <div class="field">
            <label for="p-price">Price (LKR)</label>
            <input type="number" id="p-price" required min="0" step="1" placeholder="e.g. 385000">
          </div>

          <div class="field">
            <label for="p-specs">Specs (එකක් per line)</label>
            <textarea id="p-specs" required placeholder="6.8&quot; Dynamic AMOLED&#10;Snapdragon 8 Elite&#10;12GB RAM / 256GB&#10;200MP Camera"></textarea>
          </div>

          <div class="field">
            <label>Phone Image</label>
            <label class="file-drop" id="file-drop-label">
              <input type="file" id="p-image" accept="image/*" required>
              <p id="file-drop-text">Click to choose an image, or drag one here</p>
            </label>
            <div class="file-preview" id="file-preview">
              <img id="file-preview-img" src="" alt="Preview">
            </div>
          </div>

          <button type="submit" class="btn-primary" id="upload-btn" style="width:100%; justify-content:center;">Upload Phone</button>
          <div class="upload-progress" id="upload-progress"><div class="bar" id="upload-progress-bar"></div></div>
          <p class="upload-status" id="upload-status"></p>
        </form>

        <p style="font-family:var(--font-display); font-weight:700; font-size:1.1rem; margin:0 0 1.2rem;">Existing Phones</p>
        <div class="admin-phone-list" id="admin-phone-list">
          <p class="comment-empty">Loading…</p>
        </div>
      </div>

    </div>
  </section>
</main>

<footer>
  <div class="footer-left">
    <a href="index.html" class="wordmark">Mathee<span>X</span></a>
    <p>Unboxing · Software Updates · Phone Reviews</p>
  </div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
  import {
    getStorage, ref, uploadBytesResumable, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCkEvN1kvD4LfbQLs8TQgjuMlmTYDPQZ8",
    authDomain: "matheex-comments.firebaseapp.com",
    projectId: "matheex-comments",
    storageBucket: "matheex-comments.firebasestorage.app",
    messagingSenderId: "621126172186",
    appId: "1:621126172186:web:c86406b2eb15f4bb9fdba3",
    measurementId: "G-RMV55P3LFK"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  const phonesCol = collection(db, "phones");

  // ---------------- Login gate ----------------
  const gate = document.getElementById("admin-gate");
  const content = document.getElementById("admin-content");
  const emailInput = document.getElementById("a-email");
  const passInput = document.getElementById("a-pass");
  const loginBtn = document.getElementById("a-login-btn");
  const loginStatus = document.getElementById("a-login-status");
  const whoEl = document.getElementById("admin-who");
  const logoutBtn = document.getElementById("a-logout");

  loginBtn.addEventListener("click", async () => {
    loginStatus.textContent = "Logging in…";
    loginStatus.className = "upload-status";
    try{
      await signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value);
      passInput.value = "";
      loginStatus.textContent = "";
    }catch(err){
      loginStatus.textContent = "Login වැරදියි.";
      loginStatus.className = "upload-status err";
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  // Only this exact email is allowed into the admin panel — anyone else
  // (e.g. a visitor who signed in with Google on the Home/Contact page)
  // is signed out and shown the login gate, even if a session exists.
  const ADMIN_EMAIL = "hasithmatheesha184@gmail.com";

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ADMIN_EMAIL){
      gate.style.display = "none";
      content.classList.add("show");
      whoEl.textContent = "Logged in: " + user.email;
      listenPhoneList();
    } else {
      if (user) signOut(auth); // wrong account — kick it out silently
      gate.style.display = "block";
      content.classList.remove("show");
    }
  });

  // ---------------- Image preview ----------------
  const fileInput = document.getElementById("p-image");
  const filePreview = document.getElementById("file-preview");
  const filePreviewImg = document.getElementById("file-preview-img");
  const fileDropText = document.getElementById("file-drop-text");

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileDropText.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      filePreviewImg.src = e.target.result;
      filePreview.classList.add("show");
    };
    reader.readAsDataURL(file);
  });

  // ---------------- Upload form ----------------
  const form = document.getElementById("upload-form");
  const uploadBtn = document.getElementById("upload-btn");
  const uploadStatus = document.getElementById("upload-status");
  const progressWrap = document.getElementById("upload-progress");
  const progressBar = document.getElementById("upload-progress-bar");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("p-name").value.trim();
    const price = document.getElementById("p-price").value;
    const specsRaw = document.getElementById("p-specs").value;
    const file = fileInput.files[0];

    if (!name || !price || !file) return;

    const specs = specsRaw.split("\n").map(s => s.trim()).filter(Boolean);

    uploadBtn.disabled = true;
    uploadStatus.textContent = "";
    uploadStatus.className = "upload-status";
    progressWrap.classList.add("show");
    progressBar.style.width = "0%";

    try{
      const path = `phones/${Date.now()}_${file.name}`;
      const storageRef = ref(storage, path);
      const task = uploadBytesResumable(storageRef, file);

      task.on("state_changed", (snap) => {
        const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
        progressBar.style.width = pct + "%";
      });

      await task;
      const imageUrl = await getDownloadURL(storageRef);

      await addDoc(phonesCol, {
        name,
        price: Number(price),
        specs,
        imageUrl,
        imagePath: path,
        createdAt: serverTimestamp()
      });

      form.reset();
      filePreview.classList.remove("show");
      fileDropText.textContent = "Click to choose an image, or drag one here";
      uploadStatus.textContent = "Uploaded! 🎉";
      uploadStatus.className = "upload-status ok";
    }catch(err){
      uploadStatus.textContent = "Upload වුනේ නෑ: " + err.message;
      uploadStatus.className = "upload-status err";
    }finally{
      uploadBtn.disabled = false;
      progressWrap.classList.remove("show");
    }
  });

  // ---------------- Existing phones list (with delete) ----------------
  const listEl = document.getElementById("admin-phone-list");
  let unsubList = null;

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function listenPhoneList(){
    if (unsubList) return;
    const q = query(phonesCol, orderBy("createdAt", "desc"));
    unsubList = onSnapshot(q, (snapshot) => {
      const phones = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      if (phones.length === 0){
        listEl.innerHTML = '<p class="comment-empty">තවම phones නෑ.</p>';
        return;
      }
      listEl.innerHTML = phones.map(p => `
        <div class="admin-phone-row" data-id="${p.id}">
          <img src="${p.imageUrl || ""}" alt="">
          <div class="info">
            <strong>${escapeHtml(p.name || "Untitled")}</strong>
            <span>Rs. ${Number(p.price).toLocaleString("en-LK")}</span>
          </div>
          <button class="c-delete" data-del="${p.id}" type="button">🗑 Delete</button>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("මේ phone එක delete කරන්නද?")) return;
          try{
            await deleteDoc(doc(db, "phones", btn.dataset.del));
          }catch(err){
            alert("Delete වුනේ නෑ: " + err.message);
          }
        });
      });
    });
  }
</script>

</body>
</html>
